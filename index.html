<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1a2336;--surf:#212d42;--surf2:#283349;--surf3:#2f3c54;
  --bdr:rgba(255,255,255,.13);--bdr2:rgba(255,255,255,.2);--bdr3:rgba(255,255,255,.28);
  --text:#f5f8ff;--mut:#9aafc8;--dim:#4a6480;
  --ig:#00B4D8;--fb:#3A86FF;--tt:#FF006E;--ga:#06D6A0;
  --up:#2ED573;--dn:#FF4757;--skip:#FFA502;--gold:#FFD166;--aurora:#00E55A;
  --f:Arial,Helvetica,sans-serif;--m:'Courier New',Courier,monospace;
}
body{background:var(--bg);color:var(--text);font-family:var(--f);font-size:9px;overflow-x:hidden}
.shell{max-width:1300px;margin:0 auto;padding:0 14px 36px}

/* topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 0 9px;border-bottom:1px solid var(--bdr);margin-bottom:0}
.brand{font-size:12px;font-weight:700;letter-spacing:-.2px}
.brand-sub{font-size:9px;color:var(--mut);letter-spacing:.7px;text-transform:uppercase;margin-top:1px}
.topbar-r{display:flex;align-items:center;gap:7px}
.upd-badge{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--mut);padding:4px 9px;border:1px solid var(--bdr);border-radius:4px;background:var(--surf)}
.upd-dot{width:5px;height:5px;border-radius:50%;background:var(--mut);flex-shrink:0}
.upd-dot.fresh{background:var(--up)}
.upd-dot.stale{background:var(--skip)}
.upload-btn{display:flex;align-items:center;gap:5px;background:var(--surf2);border:1px solid var(--bdr2);color:var(--text);font-size:9px;font-weight:700;padding:5px 10px;border-radius:5px;cursor:pointer;font-family:var(--f)}
.upload-btn:hover{border-color:var(--bdr3)}
input[type=file]{display:none}

/* tabs */
.tabbar{display:flex;align-items:flex-end;padding:10px 0 0;border-bottom:1px solid var(--bdr);margin-bottom:0;overflow-x:auto;gap:0}
.tab{display:flex;align-items:center;gap:5px;padding:5px 12px 6px;font-size:9px;font-weight:700;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .15s,border-color .15s}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--tc)}
.tdot{width:5px;height:5px;border-radius:50%;background:var(--tc);flex-shrink:0}

/* range bar */
.rangebar{display:flex;align-items:center;gap:7px;padding:8px 0 10px;border-bottom:1px solid var(--bdr);margin-bottom:14px;flex-wrap:wrap}
.rb{font-size:9px;font-weight:700;padding:4px 8px;border-radius:4px;border:1px solid var(--bdr);background:transparent;color:var(--mut);cursor:pointer;font-family:var(--f)}
.rb:hover,.rb.on{border-color:var(--bdr2);color:var(--text);background:var(--surf2)}
.rsep{width:1px;height:14px;background:var(--bdr2);flex-shrink:0}
.dr-lbl{font-size:9px;color:var(--mut);font-weight:700}


select.rcsel{background:var(--surf2);border:1px solid var(--bdr2);color:var(--text);font-size:9px;padding:4px 8px;border-radius:4px;font-family:var(--f);outline:none;cursor:pointer;height:26px}
select.rcsel:hover,select.rcsel:focus{border-color:var(--bdr3)}

/* pages */
.pg{display:none}.pg.on{display:block}

/* section label */
.sl{font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin:12px 0 6px;display:flex;align-items:center;gap:7px}
.sl::after{content:'';flex:1;height:1px;background:var(--bdr)}
.sd{width:4px;height:4px;border-radius:50%;flex-shrink:0}

/* goals strip */
.goals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:var(--surf);border:1px solid var(--bdr);border-radius:8px;padding:11px 14px;margin-bottom:12px}
.gi{display:flex;flex-direction:column;gap:4px}
.gi-h{display:flex;justify-content:space-between;align-items:center}
.gi-n{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--mut)}
.gi-p{font-size:10px;font-weight:700;font-family:var(--m)}
.gi-t{height:3px;background:var(--dim);border-radius:2px;overflow:hidden}
.gi-f{height:100%;border-radius:2px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.gi-v{display:flex;justify-content:space-between;font-size:10px}
.gi-c{font-weight:700;font-family:var(--m)}
.gi-tg{color:var(--mut)}

/* summary kpi cards */
.sum-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px;min-width:0}
.sc{background:var(--surf);border:1px solid var(--bdr);border-radius:8px;padding:11px 13px;position:relative;overflow:hidden;transition:border-color .15s;min-width:0}
.sc:hover{border-color:var(--bdr2)}
.sc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--ac)}
.sc-lbl{font-size:8px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.sc-val{font-size:15px;font-weight:700;font-family:var(--m);line-height:1;margin-bottom:3px}
.sc-sub{font-size:10px;color:var(--mut);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.sc-ft{border-top:1px solid var(--bdr);margin-top:7px;padding-top:5px;font-size:8px;color:var(--mut)}
.sc-ft b{color:#bcd;font-family:var(--m);font-weight:700}

/* wow chips */
.wo{font-size:9px;font-weight:700;font-family:var(--m);padding:1px 4px;border-radius:3px;white-space:nowrap}
.wu{color:#2ed573;background:rgba(46,213,115,.07)}
.wd{color:#ff6b7a;background:rgba(255,71,87,.07)}
.ws{color:#ffa502;background:rgba(255,165,2,.07)}

/* insights */
.ins-g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;min-width:0}
.ins{background:var(--surf);border:1px solid var(--bdr);border-radius:8px;padding:9px 12px;min-width:0}
.ins-v{font-size:16px;font-weight:700;font-family:var(--m);line-height:1;margin-bottom:2px}
.ins-l{font-size:9px;color:var(--mut);margin-bottom:4px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.ins-c{font-size:10px;color:var(--dim)}
.ins-tag{font-size:9px;font-weight:700;padding:1px 6px;border-radius:3px;display:inline-block;margin-top:3px}

/* ── ANNUAL TABLE ── */
.tbl-wrap{overflow-x:auto;overflow-y:hidden;border-radius:8px;border:1px solid var(--bdr);margin-bottom:10px}
.tbl-wrap::-webkit-scrollbar{height:4px}
.tbl-wrap::-webkit-scrollbar-track{background:rgba(255,255,255,.03)}
.tbl-wrap::-webkit-scrollbar-thumb{background:var(--dim);border-radius:2px}
table.ann{border-collapse:collapse;width:100%;min-width:860px;font-size:9px}
table.ann thead th{padding:5px 9px;text-align:right;font-size:7px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--mut);background:var(--surf2);white-space:nowrap;border-bottom:1px solid var(--bdr);position:sticky;top:22px;z-index:3}
table.ann thead th:first-child{text-align:left;position:sticky;left:0;top:0;z-index:4;background:var(--surf2);box-shadow:2px 0 6px rgba(0,0,0,.25)}
table.ann thead th.gh{text-align:center;border-left:1px solid var(--bdr)}
table.ann tbody tr:hover td{background:rgba(255,255,255,.025)}
table.ann tbody tr:hover td:first-child{background:#28384f}
table.ann tbody tr.latest td{background:rgba(0,180,216,.04)}
table.ann tbody tr.latest td:first-child{background:#182838}
table.ann td{padding:4px 9px;text-align:right;border-bottom:1px solid var(--bdr);font-family:var(--m);white-space:nowrap;position:relative}
table.ann td:first-child{text-align:left;font-family:var(--f);position:sticky;left:0;background:var(--surf);z-index:2;font-weight:700;color:var(--text);box-shadow:2px 0 6px rgba(0,0,0,.25)}
table.ann tr:hover td:first-child{background:#1a2535}
table.ann td.gc{text-align:center;border-left:1px solid var(--bdr)}
/* heatmap cell */
.hm{display:inline-block;width:100%;text-align:right}
/* group header in column headers */
table.ann thead tr.grp-row th{padding:3px 10px;font-size:8px;text-align:center;border-bottom:1px solid var(--bdr2);position:sticky;top:0;z-index:3;background:var(--surf2)}
/* wow inline */
.wt{font-size:8px;font-family:var(--m);margin-left:3px}
.wt.u{color:var(--up)}.wt.d{color:var(--dn)}.wt.s{color:var(--skip)}
/* missing */
.miss{color:var(--dim);font-style:italic}

/* nodata */
.nodata-banner{display:flex;align-items:center;gap:7px;background:rgba(255,165,2,.04);border:1px solid rgba(255,165,2,.12);border-radius:6px;padding:6px 10px;font-size:10px;color:var(--skip);margin-bottom:10px;font-weight:700}
.nodata-banner span{color:var(--mut);font-weight:400}
.na{color:var(--dim)!important;font-style:italic}

/* charts */
.ch{background:var(--surf);border:1px solid var(--bdr);border-radius:8px;padding:11px 14px;margin-bottom:8px;min-width:0;overflow:hidden}
.ch-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.ch-t{font-size:10px;font-weight:700}
.ch-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;max-width:100%}
.ch-scroll::-webkit-scrollbar{height:4px}
.ch-scroll::-webkit-scrollbar-thumb{background:var(--dim);border-radius:2px}
.ch-c{position:relative;height:130px;width:100%}
.ch-empty{height:130px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--dim);font-style:italic;border:1px dashed var(--bdr);border-radius:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;min-width:0}
.tc{background:var(--surf);border:1px solid var(--bdr);border-radius:8px;overflow:hidden;min-width:0}
.tc-h{padding:7px 12px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between}
.tc-t{font-size:10px;font-weight:700;display:flex;align-items:center;gap:5px}
.pill{font-size:8px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:2px 6px;border-radius:3px}
table.mt{width:100%;border-collapse:collapse;font-size:9px}
table.mt th{padding:4px 12px;text-align:left;font-size:7px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);border-bottom:1px solid var(--bdr)}
table.mt th:not(:first-child){text-align:right}
table.mt td{padding:5px 12px;border-bottom:1px solid var(--bdr);color:var(--text);table-layout:fixed}
table.mt td:not(:first-child){text-align:right;font-family:var(--m);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.mt tr:last-child td{border-bottom:none}
table.mt tr:hover td{background:rgba(255,255,255,.015)}
.mn{color:var(--mut)!important}

/* audience */
.ag{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;min-width:0}
.ac{background:var(--surf);border:1px solid var(--bdr);border-radius:8px;overflow:hidden;min-width:0}
.ac-h{padding:6px 10px;border-bottom:1px solid var(--bdr);font-size:8px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.ar{padding:4px 10px;display:flex;align-items:center;gap:6px;font-size:9px}
.ar:hover{background:rgba(255,255,255,.015)}
.ark{width:12px;font-size:8px;color:var(--dim);font-family:var(--m);text-align:right;flex-shrink:0}
.arn{flex:1;color:#d0e4f0}
.arbb{width:36px;height:3px;background:var(--dim);border-radius:2px;overflow:hidden}
.arbf{height:100%;border-radius:2px}
.arv{width:30px;text-align:right;font-family:var(--m);font-size:9px;color:var(--mut)}
.age-r{padding:3px 10px}
.age-l{font-size:9px;color:var(--mut);margin-bottom:2px;font-weight:700}
.age-bs{display:flex;height:5px;gap:1px}
.age-w{background:var(--ig);border-radius:1px 0 0 1px}
.age-m{background:var(--fb);border-radius:0 1px 1px 0}
.age-vs{display:flex;justify-content:space-between;font-size:8px;font-family:var(--m);margin-top:1px}
.avw{color:var(--ig)}.avm{color:var(--fb)}

/* GA */
.src-r{display:flex;align-items:center;gap:6px;padding:5px 12px;border-bottom:1px solid var(--bdr);font-size:9px}
.src-r:last-child{border-bottom:none}
.src-r:hover{background:rgba(255,255,255,.015)}
.src-n{flex:1;color:var(--mut)}
.src-b{width:32px;height:3px;background:var(--dim);border-radius:2px;overflow:hidden}
.src-f{height:100%;background:var(--ga);border-radius:2px}
.src-s{font-family:var(--m);width:36px;text-align:right}
.src-rv{font-family:var(--m);color:var(--ga);font-weight:700;width:58px;text-align:right}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:200}
.modal-bg.open{display:flex}
.modal{background:var(--surf2);border:1px solid var(--bdr2);border-radius:12px;padding:24px 28px;width:460px;max-width:94vw}
.modal-ttl{font-size:14px;font-weight:700;margin-bottom:5px}
.modal-sub{font-size:10px;color:var(--mut);margin-bottom:16px;line-height:1.6}
.dz{border:1px dashed var(--bdr3);border-radius:8px;padding:24px 16px;text-align:center;cursor:pointer;transition:all .15s;margin-bottom:12px}
.dz:hover,.dz.drag{border-color:var(--aurora);background:rgba(0,229,90,.04)}
.dz-t{font-size:11px;color:var(--mut)}
.dz-t b{color:var(--aurora)}
.upst{font-size:10px;min-height:18px;margin-bottom:10px}
.upst.ok{color:var(--up);font-weight:700}
.upst.err{color:var(--dn);font-weight:700}
.modal-act{display:flex;gap:7px;justify-content:flex-end}
.btn-c{font-size:10px;font-weight:700;padding:6px 12px;border-radius:5px;border:1px solid var(--bdr2);background:transparent;color:var(--mut);cursor:pointer;font-family:var(--f)}
.btn-c:hover{color:var(--text)}
.btn-a{font-size:10px;font-weight:700;padding:6px 12px;border-radius:5px;border:1px solid rgba(0,229,90,.4);background:rgba(0,229,90,.1);color:var(--aurora);cursor:pointer;font-family:var(--f)}
.btn-a:hover{background:rgba(0,229,90,.18)}
.btn-a:disabled{opacity:.35;cursor:not-allowed}

/* ── v5 additions ── */
.kpi-goal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px;min-width:0}
.kg{background:var(--surf);border:1px solid var(--bdr);border-radius:8px;padding:12px 14px;position:relative;overflow:hidden;transition:border-color .15s;min-width:0}
.kg::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--ac)}
.kg:hover{border-color:var(--bdr2)}
.kg-lbl{font-size:8px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);margin-bottom:5px}
.kg-val{font-size:14px;font-weight:700;font-family:var(--m);line-height:1;margin-bottom:2px}
.kg-sub{font-size:9px;color:var(--mut);margin-bottom:7px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.kg-track{height:4px;background:var(--dim);border-radius:2px;overflow:hidden;margin-bottom:4px}
.kg-fill{height:100%;border-radius:2px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.kg-meta{display:flex;justify-content:space-between;font-size:9px}
.kg-curr{font-family:var(--m);font-weight:700}
.kg-tgt{color:var(--mut)}
/* peak badge */
.peak-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:4px;padding:3px 7px;font-size:9px;color:var(--mut);font-weight:600;white-space:nowrap}
/* tab text brighter */
.tab{color:var(--mut)}
.tab.on{color:#f0f4ff}
/* ga layout */
.ga-metrics-row{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:10px;min-width:0}
.gm{background:var(--surf);border:1px solid var(--bdr);border-radius:7px;padding:10px 12px;min-width:0;transition:border-color .15s}
.gm:hover{border-color:var(--bdr2)}
.gm-l{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin-bottom:5px}
.gm-v{font-size:14px;font-weight:700;font-family:var(--m);line-height:1;margin-bottom:3px}
.gm-s{font-size:9px;color:var(--mut);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
/* tt video tabs */
.vid-tabs{display:flex;gap:5px;margin-bottom:8px}
.vt{font-size:9px;font-weight:600;padding:3px 9px;border-radius:4px;border:1px solid var(--bdr);background:transparent;color:var(--mut);cursor:pointer;font-family:var(--f)}
.vt.on{background:var(--surf2);border-color:var(--bdr2);color:var(--text)}
/* annual table vertical scroll */
.ann-wrap{max-height:340px;overflow-y:auto;overflow-x:auto;border-radius:8px;border:1px solid var(--bdr)}
.ann-wrap::-webkit-scrollbar{width:4px;height:4px}
.ann-wrap::-webkit-scrollbar-thumb{background:var(--dim);border-radius:2px}
/* pie chart */
.pie-wrap{position:relative;height:130px;display:flex;align-items:center;justify-content:center}
.pie-legend{display:flex;flex-direction:column;gap:4px;padding:0 8px}
.pie-item{display:flex;align-items:center;gap:5px;font-size:8px}
.pie-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
/* make text in cards more visible */
.sc-sub{color:#8aabcc!important}
.sc-ft{color:#8aabcc!important}
.sc-ft b{color:#cce0f0!important}
.mn{color:#8aabcc!important}
.kc-sl{color:#8aabcc!important}
.ins-c{color:#6a85a0!important}
.src-n{color:#8aabcc!important}
.gi-tg{color:#8aabcc!important}
.gi-n{color:#9ab0c8!important}
/* section title no week ref */
.sl{font-size:8px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin:12px 0 6px;display:flex;align-items:center;gap:7px}
.sl::after{content:'';flex:1;height:1px;background:var(--bdr)}
.sd{width:4px;height:4px;border-radius:50%;flex-shrink:0}
/* current week badge */
.cur-week-badge{display:inline-flex;align-items:center;gap:5px;background:var(--surf2);border:1px solid var(--bdr2);border-radius:5px;padding:3px 9px;font-size:9px;font-weight:700;color:var(--text);margin-bottom:12px}
.cw-dot{width:5px;height:5px;border-radius:50%;background:var(--mut)}
.sc-pk{font-size:8px;color:var(--dim);margin-top:4px;padding-top:4px;border-top:1px solid var(--bdr)}
</style>
</head>

// Formatters
function F(n)  { return n==null?'--':Math.round(n).toLocaleString(); }
function FD1(n){ return n==null?'--':Number(n).toFixed(1); }
function P(n)  { return n==null?'--':((n*100).toFixed(1)+'%'); }
function C(n)  { return n==null?'--':('$'+Number(n).toLocaleString('en-US',{maximumFractionDigits:0})); }
function isV(v){ return v!=null && v!='--' && !isNaN(v) && v!==''; }
function cl(n,a,b){ return Math.min(b,Math.max(a,n)); }
function sumF(a,fn){ return a.reduce(function(s,w){var v=fn(w);return s+(isV(v)?Number(v):0);},0); }
function avgF(a,fn){ var vs=a.map(fn).filter(isV); return vs.length?vs.reduce(function(x,y){return x+y;},0)/vs.length:null; }
function peakF(a,fn){ var mx=null,iso='',label=''; a.forEach(function(w){var v=fn(w);if(isV(v)&&(mx===null||v>mx)){mx=v;iso=w.iso;label=w.label||w.iso;}}); return {val:mx,iso:iso,label:label}; }

// WoW chip
function woW(arr,idx,fn,isRate,isCumul){
  var curr=fn(arr[idx]);
  if(!isV(curr)) return '';
  if(isCumul){
    if(idx<1) return '';
    var p=fn(arr[idx-1]); if(!isV(p)) return '';
    var d=curr-p; var cls=d>0?'wu':d<0?'wd':'wn';
    return '<span class="wo '+cls+'">'+(d>=0?'+':'')+F(d)+'</span>';
  }
  if(idx<1) return '';
  var prev=null,sk=false;
  if(!isV(fn(arr[idx-1]))) sk=true;
  for(var i=idx-1;i>=0;i--){var v=fn(arr[i]);if(isV(v)){prev=v;break;}}
  if(prev===null||prev===0) return '';
  var ch=(curr-prev)/Math.abs(prev);
  var cls=sk?'ws':ch>0?'wu':ch<0?'wd':'wn';
  var lbl=isRate?((ch>=0?'+':'')+((ch*100).toFixed(1))+'pp'):((ch>=0?'+':'')+((ch*100).toFixed(1))+'%');
  return '<span class="wo '+cls+'">'+lbl+(sk?' *':'')+'</span>';
}
function woT(arr,idx,fn,isRate){
  var curr=fn(arr[idx]); if(!isV(curr)||idx<1) return '';
  var prev=null,sk=false;
  if(!isV(fn(arr[idx-1]))) sk=true;
  for(var i=idx-1;i>=0;i--){var v=fn(arr[i]);if(isV(v)){prev=v;break;}}
  if(prev===null||prev===0) return '';
  var ch=(curr-prev)/Math.abs(prev);
  var cls=sk?'s':ch>0?'u':'d';
  var lbl=isRate?((ch>=0?'+':'')+((ch*100).toFixed(1))+'pp'):((ch>=0?'+':'')+((ch*100).toFixed(0))+'%');
  return '<span class="wt '+cls+'">'+lbl+'</span>';
}

// Tabs
function buildTabs(){
  document.getElementById('tabbar').innerHTML=TABS.map(function(t){
    return '<div class="tab'+(t.id==='dashboard'?' on':'')+'" style="--tc:'+t.col+'" data-tab="'+t.id+'" onclick="switchTab(\''+t.id+'\')"><span class="tdot"></span>'+t.label+'</div>';
  }).join('');
}
function switchTab(id){
  curTab=id;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('on',t.dataset.tab===id);});
  document.querySelectorAll('.pg').forEach(function(p){p.classList.toggle('on',p.id==='pg-'+id);});
  destroyCharts(); renderAll();
}

// Range
function buildWeekSelects(){
  var sel=document.getElementById('wk-single');
  if(!sel||!D.weeks.length) return;
  sel.innerHTML='<option value="all">-- Jump to week --</option>';
  D.weeks.slice().reverse().forEach(function(w){
    var o=document.createElement('option');
    o.value=w.iso; o.textContent=w.iso+' ('+w.label+')';
    sel.appendChild(o);
  });
  sel.value='all';
}
function setPreset(p,btn){
  curPreset=p;
  document.querySelectorAll('.rb').forEach(function(b){b.classList.remove('on');});
  if(btn) btn.classList.add('on');
  var sel=document.getElementById('wk-single');
  if(sel) sel.value='all';
  applyFilter(); renderAll();
}
function applyWeekSingle(){
  var sel=document.getElementById('wk-single');
  if(!sel||sel.value==='all'){setPreset('all',document.querySelector('.rb'));return;}
  curPreset='week1';
  document.querySelectorAll('.rb').forEach(function(b){b.classList.remove('on');});
  applyFilter(); renderAll();
}

function applyFilter(){
  var all=D.weeks;
  if(curPreset==='week1'){
    var sel=document.getElementById('wk-single');
    var iso=sel?sel.value:'all';
    FW=iso==='all'?all.slice():all.filter(function(w){return w.iso===iso;});
  } else if(typeof curPreset==='number'){
    FW=all.slice(-curPreset);
  } else {
    FW=all.slice(); // 'all' or default
  }

}
function updBadge(){
  var dot=document.getElementById('upd-dot'), txt=document.getElementById('upd-text');
  var badge=document.getElementById('upd-badge');
  if(!D.generated||!D.weeks.length){if(dot)dot.className='upd-dot';if(txt)txt.textContent='No data';return;}
  var gen=new Date(D.generated), diff=(new Date()-gen)/86400000;
  var last=D.weeks[D.weeks.length-1];
  if(dot) dot.className='upd-dot '+(diff<8?'fresh':diff<15?'stale':'');
  if(txt) txt.textContent='Latest week: '+last.iso+' - '+last.label;
  if(badge) badge.title='Updated: '+gen.toLocaleString()+'  |  '+D.weeks.length+' weeks';
}

function mkChart(id,arr,fn,col,fmt,isPct,type){

  var n=arr.length, minW=n>10?n*42:0;
  var container=el.parentElement;
  if(minW>0){
    container.innerHTML='<div class="ch-scroll"><canvas id="'+id+'" style="height:130px;display:block"></canvas></div>';
    document.getElementById(id).style.minWidth=minW+'px';
  }
  var canvas=document.getElementById(id); if(!canvas) return;
  var ctx=canvas.getContext('2d');
  CHT[id]=new Chart(ctx,{type:type,
    data:{labels:arr.map(function(w){return w.iso;}), datasets:[{

          callback:function(v){return v>=1000?Math.round(v/100)/10+'k':v;}}}
      }}
  });
}

function mkGoalLine(id, arr, valFn, col, label, goal, goalLabel){
  var el=document.getElementById(id); if(!el) return;
  var ctx=el.getContext('2d');
  var vals=arr.map(valFn);
  var goalData=arr.map(function(){return goal;});
  var lblStyle={color:'#8aabcc',font:{size:9,family:'Arial'},boxWidth:10,padding:10,usePointStyle:true,pointStyleWidth:8};
  CHT[id]=new Chart(ctx,{type:'line',
    data:{labels:arr.map(function(w){return w.label||w.iso;}), datasets:[
      {label:label,data:vals,borderColor:col,backgroundColor:col+'20',borderWidth:2,
       pointBackgroundColor:col,pointRadius:vals.map(function(_,i){return i===arr.length-1?4:3;}),
       fill:false,tension:0.4,spanGaps:true,cubicInterpolationMode:'monotone'},
      {label:goalLabel,data:goalData,borderColor:'#FFD166',borderWidth:1.5,
       borderDash:[5,4],pointRadius:0,fill:false,backgroundColor:'transparent'}
    ]},
    options:{responsive:true,maintainAspectRatio:false,layout:{padding:0},
      plugins:{legend:{display:true,position:'top',align:'end',labels:lblStyle},
        tooltip:{backgroundColor:'#161e2e',borderColor:'rgba(255,255,255,.1)',borderWidth:1,titleColor:'#5a6e8a',bodyColor:'#eef2ff',padding:7}},
      scales:{
        x:{grid:{color:'rgba(255,255,255,0.04)',drawBorder:false},ticks:{color:'#4a6480',font:{size:8,family:'Arial'}}},
        y:{grid:{color:'rgba(255,255,255,0.04)',drawBorder:false},ticks:{color:'#4a6480',font:{size:8,family:'Arial'},
          callback:function(v){return v>=1000?Math.round(v/100)/10+'k':v;}}}
      }}
  });
}

function mkPie(id, labels, values, colors){
  var el=document.getElementById(id); if(!el) return;
  var ctx=el.getContext('2d');
  CHT[id]=new Chart(ctx,{type:'doughnut',
    data:{labels:labels,datasets:[{data:values,backgroundColor:colors,borderColor:'rgba(0,0,0,.3)',borderWidth:1}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'65%',
      plugins:{legend:{display:false},
        tooltip:{backgroundColor:'#161e2e',borderColor:'rgba(255,255,255,.1)',borderWidth:1,bodyColor:'#eef2ff',padding:7,
          callbacks:{label:function(c){return c.label+': '+c.parsed.toLocaleString()+' sessions';}}}}}
  });
}

function renderAll(){
  if(!FW.length) return;
  var w=FW, last=w[w.length-1], li=w.length-1;
  destroyCharts();
  if(curTab==='dashboard') renderDashboard(w,last,li);
  if(curTab==='ig')        renderIG(w,last,li);
  if(curTab==='fb')        renderFB(w,last,li);
  if(curTab==='tt')        renderTT(w,last,li);
  if(curTab==='ga')        renderGA(w,last,li);
  if(curTab==='audience')  renderAudience();
}

  gH+='</tbody></table>';

  // Platform KPI cards with peak badges
  var trv=sumF(w,function(x){return x.ga_revenue;});
  var pkIG=peakF(w,function(x){return x.ig_reach;});
  var pkFB=peakF(w,function(x){return x.fb_views;});
  var pkGA=peakF(w,function(x){return x.ga_revenue;});

  // Top TT video all time
  var topVidStr='No video data';
  var allVids=[];
  for(var wi=0;wi<D.weeks.length;wi++){
    var wk=D.weeks[wi];
    if(wk.tt_top_videos){
      for(var vi=0;vi<wk.tt_top_videos.length;vi++){
        allVids.push({v:wk.tt_top_videos[vi],iso:wk.iso});
      }
    }
  }
  if(allVids.length){
    allVids.sort(function(a,b){return b.v.views-a.v.views;});
    topVidStr='Top video: '+F(allVids[0].v.views)+' views ('+allVids[0].iso+')';
  }

  var kItems=[
    {ac:'var(--ig)',lbl:'Instagram',  val:F(last.ig_followers),    sub:'followers',
     wow:woW(w,li,function(x){return x.ig_followers;},false,true),
     ft:'Reach '+F(last.ig_reach)+'  Eng '+P(last.ig_eng),
     peak:'Peak reach: '+F(pkIG.val)+' ('+pkIG.iso+')'},
    {ac:'var(--fb)',lbl:'Facebook',   val:F(last.fb_views),        sub:'views',
     wow:woW(w,li,function(x){return x.fb_views;}),
     ft:'Interactions '+F(last.fb_inter)+'  Viewers '+F(last.fb_viewers),
     peak:'Peak views: '+F(pkFB.val)+' ('+pkFB.iso+')'},
    {ac:'var(--tt)',lbl:'TikTok',     val:F(last.tt_followers),    sub:'followers',
     wow:woW(w,li,function(x){return x.tt_followers;},false,true),
     ft:'Video views '+F(last.tt_views)+'  Likes '+F(last.tt_likes),
     peak:topVidStr},
    {ac:'var(--ga)',lbl:'Analytics',  val:C(last.ga_revenue),      sub:'revenue',

  ];
  var kH='';

    var k=kItems[i];

      +'<div class="sc-val">'+k.val+'</div>'
      +'<div class="sc-sub">'+k.sub+' '+k.wow+'</div>'

  }

  // Annual table - newest week first
  var COLS=[
    {key:'ig_reach',    lbl:'IG Reach', fmt:F,  fn:function(x){return x.ig_reach;},    col:'#00B4D8',rate:false,cumul:false},
    {key:'ig_eng',      lbl:'Eng%',     fmt:P,  fn:function(x){return x.ig_eng;},       col:'#00B4D8',rate:true, cumul:false},
    {key:'ig_followers',lbl:'IG Flw',   fmt:F,  fn:function(x){return x.ig_followers;}, col:'#00B4D8',rate:false,cumul:true},
    {key:'ig_inter',    lbl:'Inter',    fmt:F,  fn:function(x){return x.ig_inter;},     col:'#00B4D8',rate:false,cumul:false},
    {key:'fb_views',    lbl:'FB Views', fmt:F,  fn:function(x){return x.fb_views;},     col:'#3A86FF',rate:false,cumul:false},
    {key:'fb_inter',    lbl:'FB Inter', fmt:F,  fn:function(x){return x.fb_inter;},     col:'#3A86FF',rate:false,cumul:false},
    {key:'tt_views',    lbl:'TT Views', fmt:F,  fn:function(x){return x.tt_views;},     col:'#FF006E',rate:false,cumul:false},
    {key:'tt_followers',lbl:'TT Flw',   fmt:F,  fn:function(x){return x.tt_followers;}, col:'#FF006E',rate:false,cumul:true},
    {key:'ga_sessions', lbl:'GA Sess',  fmt:F,  fn:function(x){return x.ga_sessions;},  col:'#06D6A0',rate:false,cumul:false},
    {key:'ga_revenue',  lbl:'GA Rev',   fmt:C,  fn:function(x){return x.ga_revenue;},   col:'#06D6A0',rate:false,cumul:false}
  ];

  var colMins=[],colMaxs=[];
  for(var ci=0;ci<COLS.length;ci++){
    var vals=w.map(COLS[ci].fn).filter(isV);

    colMaxs.push(vals.length?Math.max.apply(null,vals):1);

    +'<th style="position:sticky;left:0;top:0;z-index:4;background:var(--surf2)"></th>'

    +'<th colspan="2" style="text-align:center;color:#FF006E;border-left:1px solid rgba(255,255,255,.06)">TikTok</th>'
    +'<th colspan="2" style="text-align:center;color:#06D6A0;border-left:1px solid rgba(255,255,255,.06)">Analytics</th>'

  var revW=w.slice().reverse();
  var bodyH='';

    var row=revW[ri];

    var rowH='<tr class="'+(isLatest?'latest':'')+'">'
      +'<td style="text-align:left;font-family:var(--f);font-weight:700;position:sticky;left:0;background:'
      +(isLatest?'#182838':'var(--surf)')+';z-index:2;box-shadow:2px 0 5px rgba(0,0,0,.3)">'
      +'<span style="color:var(--mut);margin-right:4px">'+row.iso+'</span>'+row.label+'</td>';
    for(var ci=0;ci<COLS.length;ci++){
      var val=COLS[ci].fn(row);
      var bl=(ci===0||ci===4||ci===6||ci===8)?'border-left:1px solid rgba(255,255,255,.06);':'';
      var bg='';
      if(isV(val)&&colMaxs[ci]>colMins[ci]){

      }
      var wowt=woT(w,origIdx,COLS[ci].fn,COLS[ci].rate);
      rowH+='<td style="'+bl+bg+'">'+(isV(val)?COLS[ci].fmt(val):'<span class="miss">--</span>')+wowt+'</td>';
    }
    rowH+='</tr>';
    bodyH+=rowH;
  }
  var totH='<td style="text-align:left;font-family:var(--f);font-size:8px;color:var(--mut);font-weight:700;position:sticky;left:0;background:var(--surf2);z-index:2">TOTAL/AVG</td>';
  for(var ci=0;ci<COLS.length;ci++){

    var bl=(ci===0||ci===4||ci===6||ci===8)?'border-left:1px solid rgba(255,255,255,.06);':'';

  }

  el.innerHTML=
    '<div class="sl"><span class="sd" style="background:var(--gold)"></span>Quarterly goals</div>'
    +'<div class="tc" style="margin-bottom:10px">'+gH+'</div>'
    +'<div class="sl"><span class="sd" style="background:var(--mut)"></span>Platform snapshot &mdash; latest week</div>'
    +'<div class="sum-grid">'+kH+'</div>'
    +'<div class="sl"><span class="sd" style="background:var(--mut)"></span>Cross-platform trends</div>'
    +'<div class="two">'
    +'<div class="ch" style="margin:0"><div class="ch-h"><span class="ch-t">Follower growth &mdash; IG + TikTok</span></div><div class="ch-c" style="height:150px"><canvas id="db-flw"></canvas></div></div>'

    +'</table></div>';

  setTimeout(function(){
    mkMulti('db-flw',w,[
      {label:'IG',     fn:function(x){return x.ig_followers;}, col:'#FF006E'},
      {label:'TikTok', fn:function(x){return x.tt_followers;}, col:'#00B4D8'}
    ],F,'line');

      {label:'IG', fn:function(x){return x.ig_views;},  col:'#FF006E'},
      {label:'FB', fn:function(x){return x.fb_views;},  col:'#3A86FF'},
      {label:'TT', fn:function(x){return x.tt_views;},  col:'#00B4D8'}
    ],F,'bar');
  },80);
}

    ['Lost Followers',function(x){return x.tt_lost_flw;},       F,false,false],
    ['Net Growth',    function(x){return x.tt_net_growth;},     F,false,false],
    ['Likes',         function(x){return x.tt_likes;},          F,false,false],
    ['Comments',      function(x){return x.tt_comments;},       F,false,false],
    ['Shares',        function(x){return x.tt_shares;},         F,false,false],
    ['Website Clicks',function(x){return x.tt_website_clicks;}, F,false,false],

  }
  var pkV=peakF(w,function(x){return x.tt_views;});
  var allVids2=[];

  var topBadge=allVids2.length?('<span class="peak-badge">Top video all-time: '+F(allVids2[0].v.views)+' views ('+allVids2[0].iso+')</span>'):'';

  el.innerHTML=''

    +'<div style="display:flex;gap:5px">'

  setTimeout(function(){

function setVidView(v,btn){
  vidView=v;
  document.querySelectorAll('.vt').forEach(function(b){b.classList.remove('on');});
  if(btn) btn.classList.add('on');
  var sec=document.getElementById('vid-section');
  if(sec) sec.outerHTML=buildVidSection(v,FW);
}

function buildVidSection(view,w){
  var videos=[];
  if(view==='weekly'){
    var lw=w[w.length-1];
    var vids=lw.tt_top_videos||[];
    for(var i=0;i<vids.length;i++) videos.push({v:vids[i],iso:lw.iso,label:lw.label||lw.iso});
  } else if(view==='monthly'){
    var byMo={};
    for(var wi=0;wi<D.weeks.length;wi++){
      var wk=D.weeks[wi];
      var mo=wk.start?wk.start.substring(0,7):'?';
      if(!byMo[mo]) byMo[mo]=[];
      var vids2=wk.tt_top_videos||[];
      for(var vi=0;vi<vids2.length;vi++) byMo[mo].push({v:vids2[vi],iso:wk.iso,label:wk.label||wk.iso});
    }
    var months=Object.keys(byMo).sort();
    for(var mi=0;mi<months.length;mi++){
      var mv=byMo[months[mi]];
      mv.sort(function(a,b){return b.v.views-a.v.views;});
      for(var i=0;i<mv.length;i++) videos.push(mv[i]);
    }
  } else {
    for(var wi=0;wi<D.weeks.length;wi++){
      var wk=D.weeks[wi];
      var vids3=wk.tt_top_videos||[];
      for(var vi=0;vi<vids3.length;vi++) videos.push({v:vids3[vi],iso:wk.iso,label:wk.label||wk.iso});
    }
    videos.sort(function(a,b){return b.v.views-a.v.views;});
  }
  if(!videos.length) return '<div id="vid-section" style="padding:12px;font-size:9px;color:var(--dim);font-style:italic">No video data for this period</div>';
  var rows='';
  for(var i=0;i<videos.length;i++){
    var item=videos[i]; var v=item.v;
    var short=v.title?v.title.substring(0,75)+(v.title.length>75?'...':''):'';
    var lnk=v.url?'<a href="'+v.url+'" target="_blank" style="color:var(--tt);font-size:8px;font-weight:700;text-decoration:none">View</a>':'';
    rows+='<tr>'
      +'<td style="padding:5px 10px;color:var(--mut);font-family:var(--m);font-size:8px">'+item.iso+'</td>'
      +'<td style="padding:5px 10px;font-size:8px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+short+'</td>'
      +'<td style="padding:5px 10px;text-align:center;font-size:8px;color:var(--mut)">'+v.posted+'</td>'
      +'<td style="padding:5px 10px;text-align:right;font-family:var(--m);font-weight:700;color:var(--tt)">'+F(v.views)+'</td>'
      +'<td style="padding:5px 10px;text-align:right;font-family:var(--m)">'+F(v.likes)+'</td>'
      +'<td style="padding:5px 10px;text-align:right;font-family:var(--m)">'+F(v.comments)+'</td>'
      +'<td style="padding:5px 10px;text-align:right;font-family:var(--m)">'+F(v.shares)+'</td>'
      +'<td style="padding:5px 10px">'+lnk+'</td>'
      +'</tr>';
  }
  var onW=view==='weekly'?'on':''; var onM=view==='monthly'?'on':''; var onA=view==='alltime'?'on':'';
  return '<div id="vid-section">'
    +'<div class="sl"><span class="sd" style="background:var(--tt)"></span>Top videos</div>'
    +'<div class="vid-tabs">'
    +'<button class="vt '+onW+'" onclick="setVidView(\'weekly\',this)">This week</button>'
    +'<button class="vt '+onM+'" onclick="setVidView(\'monthly\',this)">By month</button>'
    +'<button class="vt '+onA+'" onclick="setVidView(\'alltime\',this)">All time</button>'
    +'</div>'
    +'<div class="tc"><table class="mt"><thead><tr>'
    +'<th>Week</th><th>Title</th><th style="text-align:center">Posted</th>'
    +'<th style="text-align:right">Views</th><th style="text-align:right">Likes</th>'
    +'<th style="text-align:right">Comments</th><th style="text-align:right">Shares</th><th></th>'
    +'</tr></thead><tbody>'+rows+'</tbody></table></div>'
    +'</div>';
}

function renderAudience(){
  var el=document.getElementById('pg-audience');
  var aud=D.audience||{};
  var ig=aud.ig||null; var fb=aud.fb||null;
  var tt=(aud.tt&&aud.tt.daily&&aud.tt.daily.length)?aud.tt:null;
  if(!ig&&!fb&&!tt){
    el.innerHTML='<div class="nodata-banner" style="margin-top:14px">No audience data. Upload a JSON with audience data.</div>';
    return;
  }
  function barRows(items,color){
    if(!items||!items.length) return '<div style="padding:10px 12px;font-size:8px;color:var(--dim)">No data</div>';
    var mx=Math.max.apply(null,items.map(function(x){return x.pct;}));
    var h='';
    for(var i=0;i<items.length;i++){
      var item=items[i]; var bw=mx>0?Math.round(item.pct/mx*100):0;
      h+='<div class="ar"><span class="ark">'+(i+1)+'</span><span class="arn">'+item.name+'</span>'
        +'<div class="arbb"><div class="arbf" style="width:'+bw+'%;background:'+color+'"></div></div>'
        +'<span class="arv">'+Math.round(item.pct*1000)/10+'%</span></div>';
    }
    return h;
  }
  function ageRows(age_data,g_order){
    if(!age_data||!age_data.length) return '';
    var g1=(g_order&&g_order[0])||'V1'; var g2=(g_order&&g_order[1])||'V2';
    var c1=g1.toLowerCase().indexOf('women')>=0?'var(--ig)':'var(--fb)';
    var c2=g2.toLowerCase().indexOf('women')>=0?'var(--ig)':'var(--fb)';
    var maxT=0;
    for(var i=0;i<age_data.length;i++){var t=(age_data[i].v1||0)+(age_data[i].v2||0);if(t>maxT)maxT=t;}
    var h='<div style="display:flex;gap:10px;padding:5px 12px 2px;font-size:8px;font-weight:700">'
      +'<span style="color:'+c1+'">'+g1+'</span><span style="color:'+c2+'">'+g2+'</span></div>';
    for(var i=0;i<age_data.length;i++){
      var a=age_data[i];
      var w1=maxT>0?Math.round((a.v1||0)/maxT*100):0;
      var w2=maxT>0?Math.round((a.v2||0)/maxT*100):0;
      h+='<div class="age-r"><div class="age-l">'+a.band+'</div>'
        +'<div class="age-bs"><div style="flex:'+w1+';background:'+c1+';height:5px;border-radius:1px 0 0 1px"></div>'
        +'<div style="flex:'+w2+';background:'+c2+';height:5px;border-radius:0 1px 1px 0"></div></div>'
        +'<div class="age-vs"><span style="color:'+c1+'">'+Math.round((a.v1||0)*1000)/10+'%</span>'
        +'<span style="color:'+c2+'">'+Math.round((a.v2||0)*1000)/10+'%</span></div></div>';
    }
    return h;
  }
  var html='';
  if(ig){
    html+='<div class="sl"><span class="sd" style="background:var(--ig)"></span>Instagram audience</div>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px">'
      +'<div class="ac"><div class="ac-h" style="color:var(--ig)">Age &amp; Gender</div>'+ageRows(ig.age_gender,ig.gender_order)+'</div>'
      +'<div class="ac"><div class="ac-h" style="color:var(--ig)">Top Countries</div>'+barRows(ig.top_countries,'var(--ig)')+'</div>'
      +'<div class="ac"><div class="ac-h" style="color:var(--ig)">Top Cities</div>'+barRows(ig.top_cities,'#7BC8D8')+'</div>'
      +'</div>';
  }
  if(fb){
    html+='<div class="sl"><span class="sd" style="background:var(--fb)"></span>Facebook audience</div>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px">'
      +'<div class="ac"><div class="ac-h" style="color:var(--fb)">Age &amp; Gender</div>'+ageRows(fb.age_gender,fb.gender_order)+'</div>'
      +'<div class="ac"><div class="ac-h" style="color:var(--fb)">Top Countries</div>'+barRows(fb.top_countries,'var(--fb)')+'</div>'
      +'<div class="ac"><div class="ac-h" style="color:var(--fb)">Top Cities</div>'+barRows(fb.top_cities,'#7AA6FF')+'</div>'
      +'</div>';
  }
  if(tt&&tt.daily&&tt.daily.length){
    var daily=tt.daily; var lastD=daily[daily.length-1];
    var ttKpis=[
      {l:'Total Followers',v:lastD.total_flw,col:'var(--tt)'},
      {l:'New Followers',v:lastD.new_flw,col:'var(--tt)'},
      {l:'Reached',v:lastD.reached,col:'#ff669a'},
      {l:'Engaged',v:lastD.engaged,col:'#ff669a'}
    ];
    html+='<div class="sl"><span class="sd" style="background:var(--tt)"></span>TikTok audience</div>'
      +'<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px">';
    for(var i=0;i<ttKpis.length;i++){
      var kp=ttKpis[i];
      html+='<div class="ac" style="padding:10px 12px">'
        +'<div style="font-size:8px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);margin-bottom:5px">'+kp.l+'</div>'
        +'<div style="font-size:18px;font-weight:700;font-family:var(--m);color:'+kp.col+'">'+Number(kp.v).toLocaleString()+'</div>'
        +'</div>';
    }
    html+='</div><div class="ac">'
      +'<div style="font-size:8px;font-weight:700;text-transform:uppercase;color:var(--tt);padding:7px 12px 6px;border-bottom:1px solid var(--bdr)">Daily breakdown</div>'
      +'<table style="width:100%;border-collapse:collapse;font-size:9px"><thead><tr style="border-bottom:1px solid var(--bdr)">'
      +'<th style="padding:4px 12px;text-align:left;font-size:7px;font-weight:700;text-transform:uppercase;color:var(--mut)">Date</th>'
      +'<th style="padding:4px 12px;text-align:right;font-size:7px;font-weight:700;text-transform:uppercase;color:var(--mut)">New</th>'
      +'<th style="padding:4px 12px;text-align:right;font-size:7px;font-weight:700;text-transform:uppercase;color:var(--mut)">Total</th>'
      +'<th style="padding:4px 12px;text-align:right;font-size:7px;font-weight:700;text-transform:uppercase;color:var(--mut)">Reached</th>'
      +'<th style="padding:4px 12px;text-align:right;font-size:7px;font-weight:700;text-transform:uppercase;color:var(--mut)">Engaged</th>'
      +'</tr></thead><tbody>';
    for(var i=0;i<daily.length;i++){
      var d=daily[i]; var bg=i%2===0?'':'background:rgba(255,255,255,.015);';
      html+='<tr style="'+bg+'"><td style="padding:4px 12px;color:var(--mut);font-family:var(--m)">'+d.date+'</td>'
        +'<td style="padding:4px 12px;text-align:right;font-family:var(--m);color:var(--tt)">+'+d.new_flw+'</td>'
        +'<td style="padding:4px 12px;text-align:right;font-family:var(--m);font-weight:700">'+Number(d.total_flw).toLocaleString()+'</td>'
        +'<td style="padding:4px 12px;text-align:right;font-family:var(--m)">'+Number(d.reached).toLocaleString()+'</td>'
        +'<td style="padding:4px 12px;text-align:right;font-family:var(--m)">'+Number(d.engaged).toLocaleString()+'</td></tr>';
    }
    html+='</tbody></table></div>';
  }
  el.innerHTML=html;
}

function openModal(){ document.getElementById('modal').classList.add('open'); }
function closeModal(){
  document.getElementById('modal').classList.remove('open');
  pendJSON=null;
  document.getElementById('upst').textContent='';
  document.getElementById('upst').className='upst';
  document.getElementById('apbtn').disabled=true;
}
function handleDrop(e){ e.preventDefault(); document.getElementById('dz').classList.remove('drag'); handleMultiFile(e.dataTransfer.files); }
function handleMultiFile(files){
  if(!files||files.length===0){setSt('Please select at least one .json file','err');return;}
  pendJSON=null;
  var allWeeks=[]; var latestAudience={}; var errors=[]; var filesProcessed=0; var total=files.length;
  for(var fi=0;fi<total;fi++){
    var file=files[fi];
    if(!file.name.endsWith('.json')){errors.push(file.name);filesProcessed++;if(filesProcessed===total)finalizeMerge(allWeeks,latestAudience,errors);continue;}
    (function(f){
      var r=new FileReader();
      r.onload=function(ev){
        try{
          var p=JSON.parse(ev.target.result);
          if(p.weeks&&Array.isArray(p.weeks)) allWeeks=allWeeks.concat(p.weeks);
          else errors.push(f.name+' (invalid)');
          // Keep audience from any file that has it
          if(p.audience&&(p.audience.ig||p.audience.fb||p.audience.tt)){
            latestAudience=p.audience;
          }
        }catch(err){errors.push(f.name+' (parse error)');}
        filesProcessed++;
        if(filesProcessed===total) finalizeMerge(allWeeks,latestAudience,errors);
      };
      r.onerror=function(){errors.push(f.name);filesProcessed++;if(filesProcessed===total)finalizeMerge(allWeeks,latestAudience,errors);};
      r.readAsText(f);
    })(file);
  }
}
function finalizeMerge(allWeeks,latestAudience,errors){
  if(!allWeeks.length){setSt('No valid weeks found','err');return;}
  // Use audience from uploaded file if it has data, otherwise keep existing
  var aud=(latestAudience&&(latestAudience.ig||latestAudience.fb||latestAudience.tt))?latestAudience:D.audience;
  pendJSON={weeks:allWeeks,audience:aud,generated:new Date().toISOString()};
  var newCount=allWeeks.filter(function(w){return !D.weeks.find(function(ew){return ew.iso===w.iso;});}).length;
  setSt('Ready - '+allWeeks.length+' weeks, '+newCount+' new'+(errors.length?' ('+errors.length+' skipped)':''),'ok');
  document.getElementById('apbtn').disabled=false;
}
function setSt(msg,cls){ var el=document.getElementById('upst'); el.textContent=msg; el.className='upst '+(cls||''); }
function applyUpload(){
  if(!pendJSON) return;
  for(var i=0;i<pendJSON.weeks.length;i++){
    var nw=pendJSON.weeks[i];
    var idx=D.weeks.findIndex(function(ew){return ew.iso===nw.iso;});
    if(idx>=0) D.weeks[idx]=nw; else D.weeks.push(nw);
  }
  D.weeks.sort(function(a,b){return a.iso.localeCompare(b.iso);});
  if(pendJSON.audience) D.audience=pendJSON.audience;
  D.generated=pendJSON.generated||new Date().toISOString();
  buildWeekSelects(); applyFilter(); updBadge();
  downloadHTML(); closeModal(); destroyCharts(); renderAll();
}
function downloadHTML(){
  var html=document.documentElement.outerHTML;
  var MARKER='// == DATA_START ==';
  var END_MARKER='// == DATA_END ==';
  var s=html.indexOf(MARKER); var e=html.indexOf(END_MARKER,s)+END_MARKER.length;
  if(s<0){alert('Data marker not found');return;}
  var block=MARKER+'\nvar EMBEDDED_DATA = '+JSON.stringify(D)+';\n'+END_MARKER;
  var updated=html.substring(0,s)+block+html.substring(e);
  var fname='akwl-dashboard-'+D.weeks[D.weeks.length-1].iso+'.html';
  try {
    // Method 1: Blob (may be blocked by AV)
    var blob=new Blob([updated],{type:'text/html;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download=fname;
    document.body.appendChild(a); a.click();
    setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},200);
  } catch(err){
    // Method 2: data URI fallback
    var a2=document.createElement('a');
    a2.href='data:text/html;charset=utf-8,'+encodeURIComponent(updated);
    a2.download=fname;
    document.body.appendChild(a2); a2.click();
    setTimeout(function(){document.body.removeChild(a2);},200);
  }
}

document.addEventListener('DOMContentLoaded',init);


</script>
